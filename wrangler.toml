name = "qezvo-agent-api"
main = "api/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""

# ── D1 Database ──
[[d1_databases]]
binding = "DB"
database_name = "qezvo-agent-db"
database_id = "3c55e18a-237a-4b30-aac5-148bddcb93cb"
migrations_dir = "migrations"

# ── R2 Storage ──
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "agentforge-storage"

# ── KV Store ──
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"

# ── Durable Objects ──
[[durable_objects.bindings]]
name = "TRAINING_DO"
class_name = "TrainingDO"

[[durable_objects.bindings]]
name = "CRAWL_DO"
class_name = "CrawlDO"

[[migrations]]
tag = "v1"
new_classes = ["TrainingDO", "CrawlDO"]

# ── Secrets (set via `wrangler secret put`) ──
# FIREBASE_SERVICE_ACCOUNT_JSON
# OLLAMA_API_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# WEBHOOK_SIGNING_SECRET

# ── Vars ──
[vars]
NODE_ENV = "development"
APP_URL = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
MAX_FILE_SIZE_MB = "50"
MAX_AGENTS_PER_ORG_FREE = "3"
MAX_AGENTS_PER_ORG_PRO = "25"
MAX_AGENTS_PER_ORG_BUSINESS = "999"
